name: Licence audit

# The weekly link check proves every URL resolves. Nothing proved that the licence behind an
# entry still says what the entry claims — and licences change, which is the one thing this
# directory exists to make visible. Each entry can carry the date its licence wording was
# read and the page it was read at; this job ages those claims and files an issue when one
# has gone a year without anybody looking again.
#
# It fails only on a *stale* date. Entries that carry no date are reported as a backlog —
# they predate the field, and inventing a date for them would be worse than admitting there
# is none, so the run stays green while the backlog shrinks.
on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit the licence check dates
        id: audit
        continue-on-error: true
        env:
          AUDIT_REPORT: ${{ runner.temp }}/licence-audit.md
        run: |
          set -euo pipefail
          python3 scripts/check_entry.py --license-audit --max-age-days 365 | tee "$AUDIT_REPORT"
      - name: Open or update the tracking issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          AUDIT_REPORT: ${{ runner.temp }}/licence-audit.md
        with:
          script: |
            const fs = require("fs");
            const p = process.env.AUDIT_REPORT;
            const report = (p && fs.existsSync(p)) ? fs.readFileSync(p, "utf8") : "_Report unavailable — see workflow logs._";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The licence audit found entries whose licence check date is over a year old.\n\n` +
              "```\n" + report + "```\n" +
              `Re-read the source, then update \`license_checked\` (and \`license_source\` if the terms moved).\n\nRun: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "licence-audit", per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "🧾 License audit: entries older than a year", body, labels: ["licence-audit"] });
            }
      - name: Fail when a checked date has gone stale
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::A licence check date is over a year old — see the tracking issue."
          exit 1
