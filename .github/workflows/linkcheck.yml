name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # the weekly run commits linkcheck-status.json, which READMEs render
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check all resource links
        env:
          LINKCHECK_REPORT: ${{ runner.temp }}/linkcheck-report.md
        run: python scripts/linkcheck.py --status-file linkcheck-status.json
      # Runs even when the check failed, so a red result is recorded rather than leaving the
      # previous week's "0 broken" on display. Regenerating the READMEs here is what keeps
      # `build_readme.py --check` in CI happy after the status file moves.
      - name: Record the result for the README badge
        if: always()
        run: |
          set -euo pipefail
          test -f linkcheck-status.json || { echo "no status file written"; exit 0; }
          python3 scripts/build_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkcheck-status.json README.md README.zh-CN.md
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "chore: record link check ($(python3 -c "import json;print(json.load(open('linkcheck-status.json'))['broken'])") broken) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Hint on failure
        if: failure()
        run: |
          echo "Broken links were found. See the job summary above, then either:"
          echo "  - update/replace the URL in data/*.json, or"
          echo "  - remove the entry if the service is gone, or"
          echo "  - add \"skip_linkcheck\": true with justification (login walls etc)."
      - name: Open or update tracking issue
        if: failure()
        uses: actions/github-script@v9
        env:
          LINKCHECK_REPORT: ${{ runner.temp }}/linkcheck-report.md
        with:
          script: |
            const fs = require("fs");
            const p = process.env.LINKCHECK_REPORT;
            const report = (p && fs.existsSync(p)) ? fs.readFileSync(p, "utf8") : "_Report unavailable — see workflow logs._";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "link-check", per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number,
                body: `Still failing as of ${new Date().toISOString()}.\n\n${report}\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "🔗 Link check found broken links",
                body: `The scheduled link check failed.\n\n${report}\n\nRun: ${runUrl}`,
                labels: ["link-check"],
              });
            }
